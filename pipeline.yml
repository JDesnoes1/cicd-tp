name: pipeline

on:
  push:
    branches:
      - master 

jobs:
  build: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: 
          node-version-file: '.nvmrc '
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Lancer le lint
        run: npm run lint 


